<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow" />
    <link rel="manifest" href="manifest.json" />
    <meta name="author" content="SimRail-Expert" />
    <link rel="canonical" href="https://simrail-expert.de/projects/srto">
    <title>SRTO has moved</title>
    <style>
        @font-face {
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 100 700;
            font-style: normal;
            font-display: swap;
            src: url('assets/fonts/IBMPlexSans.ttf') format('truetype');
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
            --text-primary: rgb(255, 249, 236);
            --text-alt: rgb(193, 186, 169);
            --text-alt2: rgb(152, 145, 134);
            --text-contrast: rgb(255, 228, 183);
            --text-contrast-heavy: rgb(255, 205, 119);
            --text-contrast-heavy-dim: rgba(255, 205, 119, 0.5);
            --text-muted: rgb(100, 100, 100);
            --bg-base: rgb(15, 15, 15);
            --bg-alt: rgb(26, 26, 26);
            --bg-alt2: rgb(37, 37, 37);
            --bg-hover: rgb(60, 60, 60);
            --border: rgb(100, 100, 100);
            --border-alt: rgb(130, 130, 130);
            --border-dim: rgb(70, 70, 70);
            --shadow: rgba(0, 0, 0, 0.25);
            --green: #4fae72;
            --green-dim: #254531;
            --red: #e0665f;
        }

        .pageShell {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }

        .header {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 64px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--border);
            background-color: var(--bg-alt);
        }

        .brand {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .brand img {
            width: 32px;
            height: 32px;
            aspect-ratio: 1/1;
        }

        .brand h1 {
            /* font-size: 26px; */
            margin: 0;
            padding: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
        }

        .content h1 {
            font-size: 3rem;
        }

        .content p {
            font-size: 1.6rem;
            text-align: center;
        }

        .content p strong {
            color: var(--text-contrast);
        }

        .buttons {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .socialbutton {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 150px;
            height: 35px;
            background-color: var(--bg-alt);
            border: 2px solid var(--border-dim);
            border-radius: 4px;
            text-decoration: none;
            color: var(--text-alt);
            transition: 150ms ease;
        }

        .socialbutton img {
            width: 26px;
            height: 26px;
            aspect-ratio: 1/1;
        }

        .socialbutton:hover {
            background-color: var(--bg-hover);
            color: var(--text-contrast-heavy);
            border-color: var(--text-contrast-heavy-dim);
            cursor: pointer;
        }

        .redbutton {
            margin-top: 12px;
            padding: 6px 10px;
            font-size: 30px;
            font-weight: 600;
            background-color: var(--bg-alt2);
            color: var(--text-alt);
            border: 2px solid var(--border-alt);
            text-decoration: none;
            border-radius: 6px;
            transition: 150ms ease;
        }

        .redbutton:hover {
            background-color: var(--bg-hover);
            color: var(--text-contrast-heavy);
            border-color: var(--text-contrast-heavy);
            cursor: pointer;
        }

        .brandfooter {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            margin: 14px 0px;
            font-size: 1.4rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <main class="pageShell">
        <header class="header">
            <div class="brand">
                <img src="assets/images/se.png" alt="">
                <h1 class="brand_name">SimRail-Expert</h1>
            </div>
        </header>
        <section class="content">
            <h1>SRTO has moved</h1>
            <p>The <strong>SimRail Track Overview (SRTO)</strong> now runs on its own server<br />and is part of
                <strong>SimRail-Expert</strong>, a new home for tools around SimRail.
            </p>
            <p>Want to follow the progress? Use the links below.</p>

            <div class="buttons">
                <a class="socialbutton" target='_blank' rel="noopener noreferrer"
                    href="https://forum.simrail.eu/topic/12629-simrail-track-overview-srto/">
                    <img src="assets/images/simrail-forum-logo.png" alt="">
                    Forum
                </a>
                <a class="socialbutton" target='_blank' rel="noopener noreferrer"
                    href="https://github.com/TheTrueVirus/simrail-expert.de">
                    <img src="assets/images/github-white-icon.png" alt="">
                    GitHub
                </a>
                <a class="socialbutton" target='_blank' rel="noopener noreferrer" href="https://discord.gg/BZszjfaFPu">
                    <img src="assets/images/discord.png" alt="">
                    Discord
                </a>
            </div>

            <a class="redbutton" rel="noopener noreferrer" href="https://simrail-expert.de/projects/srto">Go To SimRail-Expert</a>

            <div class="brandfooter">simrail-expert.de</div>
        </section>
    </main>
</body>

</html>
